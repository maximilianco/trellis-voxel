# Build the Z-Image-Turbo image worker on GitHub's runners and push it to GHCR, like the other workers here.
# Tags: ghcr.io/<repo>:zimage and :zimage-<sha> (pin the sha on the endpoint). The weights download at the worker's
# first start, so the image is small (torch and diffusers).
name: build zimage worker

on:
  push:
    branches: [main]
    paths:
      - "zimage/**"
      - ".github/workflows/zimage.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zimage
          file: zimage/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:zimage
            ghcr.io/${{ github.repository }}:zimage-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Image reference
        run: |
          echo "Pin this on the endpoint: ghcr.io/${{ github.repository }}:zimage-${{ github.sha }}"
          echo "Endpoint: a 24 GB GPU (offloads the text encoder) or 48 GB (all on the GPU), CUDA 12.8 hosts, 40 GB container disk."
