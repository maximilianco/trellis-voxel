name: build sf3d worker
on:
  push:
    branches: [main, sf3d-runpod]
    paths: ["sf3d/**", ".github/workflows/sf3d.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Stable Fast 3D worker
        uses: docker/build-push-action@v6
        with:
          context: ./sf3d
          file: ./sf3d/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sf3d-${{ github.sha }}
          build-args: WORKER_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=sf3d
          cache-to: type=gha,mode=max,scope=sf3d,ignore-error=true,timeout=2m
