# Build the TRELLIS worker on GitHub's runners and push to GHCR.
#
# This exists because the alternatives don't fit: the workstation has a 4 GB GPU,
# no Docker, 3 GB free on C: and a ~0.5 MB/s uplink, and renting a pod to build
# means paying for idle GPU. GitHub Actions costs nothing for a public repo,
# builds on their disk, and pushes from their network.
#
# Copy this to .github/workflows/build.yml in the repo you give Runpod.
name: build trellis worker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "handler.py", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      trellis_repo:
        description: "TRELLIS model repo"
        default: "microsoft/TRELLIS-image-large"
      bake_weights:
        description: "Embed weights in the image (0 = use Runpod --model-reference)"
        default: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # A default runner has ~14 GB free, and this image needs more than that
      # even without baked weights. Removing the preinstalled toolchains we
      # never use frees roughly 25 GB and takes about a minute.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Runpod hosts are x86_64.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            TRELLIS_REPO=${{ inputs.trellis_repo || 'microsoft/TRELLIS-image-large' }}
            BAKE_WEIGHTS=${{ inputs.bake_weights || '0' }}
          # Layer cache in the registry: the CUDA extensions take most of the
          # build, and they only need recompiling when the dependency layers move.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image reference
        run: |
          echo "Pushed ghcr.io/${{ github.repository }}:latest"
          echo "If the package is private, add a Runpod container registry auth"
          echo "entry with your GitHub username and a PAT that has read:packages."
