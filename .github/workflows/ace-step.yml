# Build the ACE-Step 1.5 music worker on GitHub's runners and push it to GHCR, like the other workers here: this
# workstation can't build or upload a 20 GB image. Tags: ghcr.io/<repo>:ace-step and :ace-step-<sha> (pin the sha on
# the endpoint; RunPod doesn't roll workers when a moving tag changes).
name: build ace-step worker

on:
  push:
    branches: [main]
    paths:
      - "ace-step/**"
      - ".github/workflows/ace-step.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is ~20 GB (torch cu128 and 10 GB of baked weights) and the push needs room for its compressed
      # layers too: clear everything the runner preinstalls that a Docker build doesn't use.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft \
                      /opt/google /usr/lib/jvm /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ace-step
          file: ace-step/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:ace-step
            ghcr.io/${{ github.repository }}:ace-step-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Image reference
        run: |
          df -h /
          echo "Pin this on the endpoint: ghcr.io/${{ github.repository }}:ace-step-${{ github.sha }}"
          echo "Endpoint: a 24 GB GPU (A5000, 3090, 4090, L4), CUDA 12.8 hosts, 40 GB container disk, no volume."
