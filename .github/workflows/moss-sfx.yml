# Build the MOSS-SoundEffect worker on GitHub's runners and push it to GHCR, like the other workers here.
# Tags: ghcr.io/<repo>:moss-sfx and :moss-sfx-<sha> (pin the sha on the endpoint). The weights download at the
# worker's first start, so the image holds only torch and the pipeline.
name: build moss-sfx worker

on:
  push:
    branches: [main]
    paths:
      - "moss-sfx/**"
      - ".github/workflows/moss-sfx.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: moss-sfx
          file: moss-sfx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:moss-sfx
            ghcr.io/${{ github.repository }}:moss-sfx-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Image reference
        run: |
          echo "Pin this on the endpoint: ghcr.io/${{ github.repository }}:moss-sfx-${{ github.sha }}"
          echo "Endpoint: a 24 GB GPU, CUDA 12.8 hosts, 30 GB container disk."
