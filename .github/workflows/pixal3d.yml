name: build pixal3d worker
on:
  push:
    branches: [main, pixal3d-runpod]
    paths: ["pixal3d/**", ".github/workflows/pixal3d.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./pixal3d
          file: ./pixal3d/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:pixal3d-${{ github.sha }}
          build-args: WORKER_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=pixal3d
          cache-to: type=gha,mode=max,scope=pixal3d
