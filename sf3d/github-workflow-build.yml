name: build sf3d worker
on:
  push:
    branches: [main, sf3d-runpod]
    paths: ["sf3d/**", ".github/workflows/sf3d.yml"]
  workflow_dispatch:
    inputs:
      full_build:
        description: Recompile the complete dependency image
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reclaim build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Select dependency or handler build
        id: source
        env:
          FULL_BUILD: ${{ inputs.full_build }}
        run: |
          file=Dockerfile.runtime
          if [ "$FULL_BUILD" = true ] || [ -n "$(git diff --name-only HEAD^ HEAD -- sf3d/Dockerfile sf3d/constraints.txt)" ]; then
            file=Dockerfile
          fi
          echo "dockerfile=./sf3d/$file" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Stable Fast 3D worker
        uses: docker/build-push-action@v6
        with:
          context: ./sf3d
          file: ${{ steps.source.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sf3d-${{ github.sha }}
          build-args: WORKER_REVISION=${{ github.sha }}
